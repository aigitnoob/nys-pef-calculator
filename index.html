<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PEF Salary Projection Tool</title>
  <style>
    :root {
      --primary: #003366;
      --secondary: #4a5568;
      --bg: #f7fafc;
      --card-bg: #ffffff;
      --text: #2d3748;
      --border: #e2e8f0;
      --badge-step: #2b6cb0;
      --badge-contract: #2f855a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 24px;
    }

    h1 {
      margin-top: 0;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      background-color: var(--primary);
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #edf2f7;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .event-step { background-color: var(--badge-step); }
    .event-contract { background-color: var(--badge-contract); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>PEF Salary Projection Tool</h1>
      <form id="salaryForm">
        <div class="form-group">
          <label for="grade">Salary Grade (SG-1 to SG-37):</label>
          <select id="grade" required>
            <!-- Options populated via JS -->
          </select>
        </div>

        <div class="form-group">
          <label for="apptDate">Appointment Date:</label>
          <input type="date" id="apptDate" required>
        </div>

        <div class="form-group">
          <label for="startStep">Starting Step on Appointment:</label>
          <select id="startStep">
            <option value="1">Step 1 (Hiring Rate)</option>
            <option value="2">Step 2</option>
            <option value="3">Step 3</option>
            <option value="4">Step 4</option>
            <option value="5">Step 5</option>
            <option value="6">Step 6</option>
            <option value="7">Step 7 (Job Rate)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="customSalary">Custom Initial Salary (Optional):</label>
          <input type="number" id="customSalary" placeholder="Leave blank to use schedule base">
        </div>

        <button type="submit">Calculate Projection</button>
      </form>
    </div>

    <div class="card" id="resultsCard" style="display: none;">
      <h2>Projected Salary Schedule</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Event Description</th>
            <th>Step Status</th>
            <th>Projected Salary</th>
          </tr>
        </thead>
        <tbody id="resultsTableBody">
        </tbody>
      </table>
    </div>
  </div>
