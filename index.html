<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYS PEF Salary Progression Calculator</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-bg: #eff6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 32px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        input, select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 24px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .summary-box {
            background-color: var(--accent-bg);
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .summary-box h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            color: #1e40af;
        }

        .summary-box p {
            margin: 4px 0;
            font-size: 0.95rem;
            color: #1e3a8a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 16px;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .advance-row {
            color: #0369a1;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>NYS PEF Salary Progression Calculator</h1>
    <p class="subtitle">Calculates performance advances and general contract increases based on official OER salary schedules.</p>

    <div class="form-grid">
        <div class="form-group">
            <label for="hireDate">Hire Date</label>
            <input type="date" id="hireDate" value="2024-03-14">
        </div>
        <div class="form-group">
            <label for="salaryGrade">Salary Grade</label>
            <select id="salaryGrade">
                <option value="18">Grade 18</option>
                <option value="23">Grade 23</option>
                <option value="24">Grade 24</option>
                <option value="25" selected>Grade 25</option>
                <option value="26">Grade 26</option>
                <option value="27">Grade 27</option>
            </select>
        </div>
        <div class="form-group">
            <label for="locationPay">Location Pay</label>
            <select id="locationPay">
                <option value="0">None (Upstate / Albany)</option>
                <option value="4150">Downstate ($4,150+)</option>
                <option value="2150">Mid-Hudson ($2,150+)</option>
            </select>
        </div>
    </div>

    <button onclick="calculateSalary()">Calculate Salary Timeline</button>

    <div id="results" class="hidden">
        <div class="summary-box">
            <h3 id="summaryTitle">Salary Grade Breakdown</h3>
            <p id="summaryDetails"></p>
        </div>

        <h3>Earnings & Step Timeline</h3>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Event Description</th>
                    <th>Step</th>
                    <th>Base Salary</th>
                    <th>Total Pay (w/ Location)</th>
                </tr>
            </thead>
            <tbody id="timelineBody"></tbody>
        </table>
    </div>
</div>

<script>
// Official NYS PEF Salary Data (March 26, 2026 Schedule)
const pefData = {
    18: { hiringRate: 69964, jobRate: 88970, advance: 2403, jobRateAdvance: 4588 },
    23: { hiringRate: 90582, jobRate: 114585, advance: 2953, jobRateAdvance: 6285 },
    24: { hiringRate: 95406, jobRate: 120439, advance: 3066, jobRateAdvance: 6637 },
    25: { hiringRate: 100671, jobRate: 126875, advance: 3197, jobRateAdvance: 7022 },
    26: { hiringRate: 105973, jobRate: 130626, advance: 3327, jobRateAdvance: 4691 },
    27: { hiringRate: 111708, jobRate: 137590, advance: 3503, jobRateAdvance: 4864 }
};

// Contract Increases (2026-2031 PEF Agreement Patterns)
const contractIncreases = [
    { date: '2026-04-01', percent: 0.045, label: '4.5% General Contract Increase' },
    { date: '2027-04-01', percent: 0.040, label: '4.0% General Contract Increase' },
    { date: '2028-04-01', percent: 0.035, label: '3.5% General Contract Increase' },
    { date: '2029-04-01', percent: 0.030, label: '3.0% General Contract Increase' },
    { date: '2030-04-01', percent: 0.030, label: '3.0% General Contract Increase' }
];

function formatMoney(amount) {
    return '$' + Math.round(amount).toLocaleString('en-US');
}

function calculateSalary() {
    const hireDateVal = document.getElementById('hireDate').value;
    const grade = parseInt(document.getElementById('salaryGrade').value);
    const locationPay = parseFloat(document.getElementById('locationPay').value);

    if (!hireDateVal) return;

    const hireDate = new Date(hireDateVal + 'T00:00:00');
    const data = pefData[grade];

    const hireMonth = hireDate.getMonth() + 1; // 1 - 12
    const hireDay = hireDate.getDate();
    
    // INCLUSIVE BOUNDARY RULE:
    // Oct 2 through Apr 1  --> APRIL Cycle (Default)
    // Apr 2 through Oct 1  --> OCTOBER Cycle
    let advanceMonth = 4; // Default April

    const isAprilTwoOrLater = (hireMonth === 4 && hireDay >= 2) || (hireMonth > 4);
    const isOctoberOneOrEarlier = (hireMonth < 10) || (hireMonth === 10 && hireDay <= 1);

    if (isAprilTwoOrLater && isOctoberOneOrEarlier) {
        advanceMonth = 10; // October
    }

    let currentStep = 1;
    let currentBase = data.hiringRate;
    let currentAdvanceAmt = data.advance;

    document.getElementById('summaryTitle').innerText = `Salary Grade: SG-${grade}`;
    document.getElementById('summaryDetails').innerHTML = `
        <strong>2026 Base (Step 1):</strong> ${formatMoney(currentBase)} | 
        <strong>Performance Advance:</strong> ${formatMoney(currentAdvanceAmt)} | 
        <strong>Advance Cycle:</strong> ${advanceMonth === 4 ? 'April' : 'October'} Cycle
    `;

    const timeline = [];

    // Push initial appointment
    timeline.push({
        dateStr: hireDateVal.substring(0, 7),
        dateObj: new Date(hireDate),
        description: 'Initial Appointment (Step 1 Base)',
        step: 1,
        base: currentBase
    });

    let startYear = hireDate.getFullYear() + 1;
    for (let yr = startYear; yr <= 2030; yr++) {
        // Apply General Contract Increase
        contractIncreases.forEach(ci => {
            const ciYear = parseInt(ci.date.substring(0, 4));
            if (ciYear === yr) {
                currentBase = currentBase * (1 + ci.percent);
                currentAdvanceAmt = currentAdvanceAmt * (1 + ci.percent);
                timeline.push({
                    dateStr: ci.date.substring(0, 7),
                    dateObj: new Date(ci.date + 'T00:00:00'),
                    description: ci.label,
                    step: currentStep,
                    base: currentBase
                });
            }
        });

        // Apply Step Advance
        if (currentStep < 7) {
            currentStep++;
            const advDateStr = `${yr}-${String(advanceMonth).padStart(2, '0')}-01`;
            const isJobRateStep = (currentStep === 7);
            const stepBoost = isJobRateStep ? (data.jobRateAdvance * (currentBase / data.hiringRate)) : currentAdvanceAmt;
            
            currentBase += stepBoost;
            timeline.push({
                dateStr: advDateStr.substring(0, 7),
                dateObj: new Date(advDateStr + 'T00:00:00'),
                description: isJobRateStep ? 'Job Rate Advance (Step 7)' : `Performance Advance (Step ${currentStep})`,
                step: currentStep,
                base: currentBase
            });
        }
    }

    // Sort timeline chronologically
    timeline.sort((a, b) => a.dateObj - b.dateObj);

    // Render Table Rows
    const tbody = document.getElementById('timelineBody');
    tbody.innerHTML = '';

    timeline.forEach(row => {
        const tr = document.createElement('tr');
        if (row.description.includes('Performance Advance')) {
            tr.classList.add('advance-row');
        }

        const dateFormatted = row.dateObj.toLocaleDateString('en-US', { month: 'short', year: 'numeric', timeZone: 'UTC' });
        const totalPay = row.base + locationPay;

        tr.innerHTML = `
            <td>${dateFormatted}</td>
            <td>${row.description}</td>
            <td>Step ${row.step}</td>
            <td>${formatMoney(row.base)}</td>
            <td><strong>${formatMoney(totalPay)}</strong></td>
        `;
        tbody.appendChild(tr);
    });

    document.getElementById('results').classList.remove('hidden');
}

// Auto-run calculation on load
window.onload = calculateSalary;
</script>
</body>
</html>
